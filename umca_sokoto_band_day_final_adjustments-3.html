<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UMCA SOKOTO — Steward of Praise Band Day</title>
<style>*{box-sizing:border-box}body{margin:0;background:#061a38;color:#f7f0df;font-family:Georgia,"Times New Roman",serif}.page{max-width:700px;margin:auto;padding:14px}.hero{text-align:center;padding:20px 8px 18px}.brand{font-size:30px;font-weight:900;letter-spacing:2px}.eyebrow{font-size:19px;font-weight:900;margin-top:8px}.intro{color:#e9dfca;margin:8px 0}.card{background:#f7f0df;color:#071a3a;border:2px solid #d4af37;border-radius:22px;padding:20px}label{display:block;font-weight:900;margin:14px 0 8px;font-size:18px}input{width:100%;padding:16px;border:2px solid #c9a227;border-radius:13px;font-size:17px;font-weight:800}button{width:100%;border:2px solid #c9a227;border-radius:13px;padding:16px;margin-top:18px;background:#071a3a;color:#f7f0df;font-weight:900;font-size:16px}.status{text-align:center;min-height:20px}.result{margin-top:22px}.result canvas{width:100%;display:block;border-radius:16px}.hidden{display:none}</style></head>
<body><main class="page"><section class="hero"><div class="brand">UMCA SOKOTO</div><div class="eyebrow">STEWARD OF PRAISE BAND DAY</div><p class="intro">Create your personalized <strong>“I WILL BE THERE”</strong> flyer.</p></section><section class="card"><label>📸 Upload your picture</label><input id="photo" type="file" accept="image/*"><label>Your name</label><input id="name" type="text" placeholder="Enter your name" maxlength="50"><button id="generate">GENERATE MY FLYER</button><p id="status" class="status"></p></section><section id="result" class="result hidden"><canvas id="flyer" width="1080" height="1350"></canvas><button id="download">DOWNLOAD FLYER</button></section></main>
<script>
const photo=document.getElementById("photo"),nameBox=document.getElementById("name"),generate=document.getElementById("generate"),download=document.getElementById("download"),canvas=document.getElementById("flyer"),ctx=canvas.getContext("2d"),result=document.getElementById("result"),status=document.getElementById("status");let img=null;
photo.onchange=()=>{const f=photo.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{img=new Image();img.onload=()=>status.textContent="Picture ready.";img.src=e.target.result};r.readAsDataURL(f)};
function line(x1,y1,x2,y2,w=4,c="#d4af37"){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function circlePhoto(im,cx,cy,r){const q=Math.max(2*r/im.width,2*r/im.height),nw=im.width*q,nh=im.height*q;ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.drawImage(im,cx-nw/2,cy-nh/2,nw,nh);ctx.restore()}
function instruments(){ctx.save();ctx.globalAlpha=.12;ctx.strokeStyle="#d4af37";ctx.fillStyle="#d4af37";ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(105,560,70,90,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(105,720,55,70,0,0,Math.PI*2);ctx.stroke();ctx.fillRect(95,390,20,170);ctx.beginPath();ctx.ellipse(950,285,95,38,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(950,460,95,38,0,0,Math.PI*2);ctx.stroke();line(855,285,855,460,7);line(1045,285,1045,460,7);ctx.lineWidth=15;ctx.beginPath();ctx.moveTo(975,380);ctx.bezierCurveTo(900,440,910,610,970,650);ctx.bezierCurveTo(1015,690,1010,770,955,800);ctx.stroke();ctx.beginPath();ctx.arc(955,805,30,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.07;ctx.fillRect(55,850,250,90);ctx.restore()}
function draw(){const W=1080,H=1350;ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#06152f");bg.addColorStop(.55,"#092652");bg.addColorStop(1,"#04142d");ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.08;ctx.fillStyle="#f7f0df";ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(280,0);ctx.lineTo(570,1000);ctx.lineTo(430,1000);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(870,0);ctx.lineTo(1060,0);ctx.lineTo(800,1000);ctx.lineTo(700,1000);ctx.closePath();ctx.fill();ctx.restore();instruments();line(0,90,150,0,9);line(1080,90,930,0,9);
ctx.textAlign="center";ctx.fillStyle="#d4af37";ctx.font="900 52px Georgia";ctx.fillText("✦",540,62);ctx.fillStyle="#f7f0df";ctx.font="900 43px Georgia";ctx.fillText("UMCA SOKOTO",540,125);ctx.font="900 27px Georgia";ctx.fillText("STEWARD OF PRAISE BAND DAY",540,166);line(360,194,720,194,3);ctx.fillStyle="#d4af37";ctx.font="900 23px Georgia";ctx.fillText("P R E S E N T S",540,229);
const cx=350,cy=590,r=310;ctx.fillStyle="#f7f0df";ctx.beginPath();ctx.arc(cx,cy,r+22,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d4af37";ctx.lineWidth=15;ctx.beginPath();ctx.arc(cx,cy,r+10,0,Math.PI*2);ctx.stroke();ctx.strokeStyle="#f3d46a";ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,r+31,0,Math.PI*2);ctx.stroke();circlePhoto(img,cx,cy,r);
ctx.fillStyle="#f7f0df";ctx.font='italic 900 78px "Brush Script MT","Segoe Script",cursive';ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=4;ctx.fillText(nameBox.value.trim(),350,958);ctx.shadowBlur=0;line(150,985,550,985,5);
ctx.textAlign="left";ctx.fillStyle="#f7f0df";ctx.font='italic 800 43px "Brush Script MT","Segoe Script",cursive';ctx.fillText("I will be",750,470);ctx.fillStyle="#d4af37";ctx.font='italic 900 76px "Brush Script MT","Segoe Script",cursive';ctx.fillText("THERE!",735,545);line(735,570,1035,570,5);ctx.fillStyle="#f7f0df";ctx.font="900 25px Georgia";ctx.fillText("27 SEPTEMBER 2026",740,630);ctx.font="900 27px Georgia";ctx.fillText("9:00 AM",825,680);ctx.font="900 24px Georgia";ctx.fillText("CHURCH AUDITORIUM",735,730);ctx.globalAlpha=.22;ctx.fillStyle="#d4af37";ctx.font="75px Georgia";ctx.fillText("♪",75,520);ctx.fillText("♫",930,840);ctx.globalAlpha=1;
ctx.fillStyle="#f7f0df";ctx.beginPath();ctx.moveTo(0,1000);ctx.quadraticCurveTo(90,980,180,1010);ctx.quadraticCurveTo(290,1040,390,1000);ctx.quadraticCurveTo(500,970,610,1010);ctx.quadraticCurveTo(730,1040,830,1000);ctx.quadraticCurveTo(960,970,1080,1010);ctx.lineTo(1080,1350);ctx.lineTo(0,1350);ctx.closePath();ctx.fill();ctx.textAlign="center";ctx.fillStyle="#071a3a";ctx.font="italic 700 28px Georgia";ctx.fillText("Powered by UMCA Media Team",540,1195);ctx.fillStyle="#d4af37";ctx.font="900 29px Georgia";ctx.fillText("✦  UMCA SOKOTO  ✦",540,1250)}
generate.onclick=()=>{const name=nameBox.value.trim();if(!img||!name){status.textContent="Please add your picture and name.";return}draw();result.classList.remove("hidden");status.textContent="Your flyer is ready.";result.scrollIntoView({behavior:"smooth"})};download.onclick=()=>{const safe=nameBox.value.trim().replace(/\s+/g,"-")||"flyer";const a=document.createElement("a");a.download=`UMCA-Band-Day-${safe}.png`;a.href=canvas.toDataURL("image/png");a.click()};
</script></body></html>
